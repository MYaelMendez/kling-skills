name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: klingai-video/package-lock.json

      - name: Install dependencies
        working-directory: klingai-video
        run: npm ci --prefer-offline || npm install

      - name: Lint
        working-directory: klingai-video
        run: npm run lint

      - name: Test
        working-directory: klingai-video
        run: npm test
